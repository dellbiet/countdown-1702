<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #fff5f5 0%, #ffd1dc 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Quicksand", sans-serif;
        color: #b05e6f;
        overflow: hidden;
      }
      .container {
        background: rgba(255, 255, 255, 0.4);
        padding: 40px 50px;
        border-radius: 35px;
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 10px 30px rgba(176, 94, 111, 0.15);
        text-align: center;
      }
      .clock-analog {
        width: 160px;
        height: 160px;
        border: 5px solid #ffffff;
        border-radius: 50%;
        margin: 0 auto 25px;
        position: relative;
        background: rgba(255, 255, 255, 0.3);
      }
      .dot {
        width: 10px;
        height: 10px;
        background: #ad1457;
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
      }
      .hand {
        position: absolute;
        bottom: 50%;
        left: 50%;
        transform-origin: bottom;
        border-radius: 5px;
        transform: translateX(-50%) rotate(0deg);
        transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      /* Thiết kế lại kích thước kim cho hợp lý */
      .day-hand {
        width: 7px;
        height: 40px;
        background: #b05e6f;
        z-index: 3;
      }
      .hour-hand {
        width: 4.5px;
        height: 55px;
        background: #ec407a;
        z-index: 2;
      }
      .minute-hand {
        width: 2.5px;
        height: 70px;
        background: #ff80ab;
        z-index: 1;
      }

      h1 {
        margin-bottom: 30px;
        font-size: 22px;
        color: #ad1457;
        font-weight: 700;
      }
      .time {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      .box {
        background: #ffffff;
        padding: 15px;
        border-radius: 20px;
        min-width: 85px;
        box-shadow: 0 5px 15px rgba(176, 94, 111, 0.08);
      }
      .number {
        font-size: 32px;
        font-weight: 700;
        color: #ec407a;
      }
      .label {
        font-size: 12px;
        margin-top: 5px;
        color: #ad1457;
        font-weight: 600;
      }
      .done {
        font-size: 28px;
        color: #ad1457;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="clock-analog">
        <div class="dot"></div>
        <div class="hand day-hand" id="day-hand"></div>
        <div class="hand hour-hand" id="hour-hand"></div>
        <div class="hand minute-hand" id="minute-hand"></div>
      </div>
      <h1>Đếm ngược Thi Tốt Nghiệp 2026</h1>
      <div id="time-display" class="time">
        <div class="box">
          <div class="number" id="days">0</div>
          <div class="label">Ngày</div>
        </div>
        <div class="box">
          <div class="number" id="hours">0</div>
          <div class="label">Giờ</div>
        </div>
        <div class="box">
          <div class="number" id="minutes">0</div>
          <div class="label">Phút</div>
        </div>
        <div class="box">
          <div class="number" id="seconds">0</div>
          <div class="label">Giây</div>
        </div>
      </div>
    </div>

    <script>
      const targetDate = new Date("2026-06-11T06:00:00").getTime();

      function updateClock() {
        const now = new Date().getTime();
        const diff = targetDate - now;

        if (diff <= 0) {
          clearInterval(timerInterval);
          document.querySelector(".container").innerHTML =
            "<div class='done'>🎉 CHÚC CÁC BẠN THI TỐT! 🎉</div>";
          return;
        }

        // --- Logic Nghịch Đảo Theo Yêu Cầu ---
        const dRemaining = diff / (1000 * 60 * 60 * 24);
        const hRemaining = (diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60);
        const mRemaining = (diff % (1000 * 60 * 60)) / (1000 * 60);

        // Kim Ngày: quay 1 vòng ứng với 365 ngày
        const dDeg = (dRemaining / 365) * 360;
        // Kim Giờ: quay 1 vòng ứng với 24 giờ đếm ngược
        const hDeg = (hRemaining / 24) * 360;
        // Kim Phút: quay 1 vòng ứng với 60 phút đếm ngược
        const mDeg = (mRemaining / 60) * 360;

        document.getElementById("day-hand").style.transform =
          `translateX(-50%) rotate(${dDeg}deg)`;
        document.getElementById("hour-hand").style.transform =
          `translateX(-50%) rotate(${hDeg}deg)`;
        document.getElementById("minute-hand").style.transform =
          `translateX(-50%) rotate(${mDeg}deg)`;

        // Hiển thị số (Vẫn giữ giây ở phần số để bạn thấy nó nhảy)
        document.getElementById("days").textContent = Math.floor(dRemaining);
        document.getElementById("hours").textContent = Math.floor(hRemaining);
        document.getElementById("minutes").textContent = Math.floor(mRemaining);
        document.getElementById("seconds").textContent = Math.floor(
          (diff / 1000) % 60,
        );
      }

      const timerInterval = setInterval(updateClock, 1000);
      updateClock();
    </script>
  </body>
</html>
