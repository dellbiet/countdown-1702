<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Countdown</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        /* Sakura Blossom Gradient */
        background: linear-gradient(135deg, #fff5f5 0%, #ffd1dc 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        /* Đổi sang font bo tròn sẽ cute hơn */
        font-family: "Quicksand", "Segoe UI", sans-serif;
        color: #b05e6f; /* Chữ màu hồng đất để nổi bật trên nền nhạt */
      }

      .container {
        /* Glassmorphism hiệu ứng kính mờ */
        background: rgba(255, 255, 255, 0.4);
        padding: 40px 50px;
        border-radius: 30px; /* Bo góc cực tròn */
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 10px 30px rgba(176, 94, 111, 0.2);
        text-align: center;
        animation: fadeIn 1.5s ease;
      }

      h1 {
        margin-bottom: 30px;
        font-size: 28px;
        color: #ad1457;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
      }

      .time {
        display: flex;
        gap: 15px;
        justify-content: center;
      }

      .box {
        /* Ô số màu hồng rất nhạt */
        background: #ffffff;
        padding: 20px;
        border-radius: 20px;
        min-width: 95px;
        box-shadow: 0 5px 15px rgba(176, 94, 111, 0.1);
      }

      .number {
        font-size: 38px;
        font-weight: bold;
        color: #ec407a; /* Màu con số hồng đậm */
        animation: pulse 1.5s infinite ease-in-out;
      }

      .label {
        font-size: 14px;
        margin-top: 5px;
        color: #ad1457;
        font-weight: 600;
        opacity: 0.9;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.03);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .done {
        font-size: 35px;
        color: #ad1457;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(255, 192, 203, 0.8);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Đếm ngược đến Thi tốt nghiệp THPT 2026</h1>

      <div id="time" class="time">
        <div class="box">
          <div class="number" id="days">0</div>
          <div class="label">Ngày</div>
        </div>
        <div class="box">
          <div class="number" id="hours">0</div>
          <div class="label">Giờ</div>
        </div>
        <div class="box">
          <div class="number" id="minutes">0</div>
          <div class="label">Phút</div>
        </div>
        <div class="box">
          <div class="number" id="seconds">0</div>
          <div class="label">Giây</div>
        </div>
      </div>
    </div>

    <script>
      // 🔧 change here
      const target = new Date("2026-06-11T00:06:00").getTime();

      const timer = setInterval(() => {
        const now = new Date().getTime();
        const diff = target - now;

        if (diff <= 0) {
          clearInterval(timer);
          document.querySelector(".container").innerHTML =
            "<div class='done'>🎉 CHÚC CÁC BẠN THI TỐT! 🎉</div>";
          return;
        }

        document.getElementById("days").textContent = Math.floor(
          diff / (1000 * 60 * 60 * 24),
        );

        document.getElementById("hours").textContent = Math.floor(
          (diff / (1000 * 60 * 60)) % 24,
        );

        document.getElementById("minutes").textContent = Math.floor(
          (diff / (1000 * 60)) % 60,
        );

        document.getElementById("seconds").textContent = Math.floor(
          (diff / 1000) % 60,
        );
      }, 1000);
    </script>
  </body>
</html>
